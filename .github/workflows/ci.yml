name: Rust
# Manual only while the project is early; run it from the Actions tab when a
# cross-platform check (build, tests, PTY smoke on Linux and macOS) is wanted
# before a release.
on: workflow_dispatch
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # macOS runs the build and tests above; the scripted-PTY smoke test is
      # unreliable against the macOS runner's pseudo-terminal, so it runs on
      # Linux, the platform it was written for.
      - if: runner.os == 'Linux'
        run: python3 scripts/terminal_smoke.py target/debug/techo
